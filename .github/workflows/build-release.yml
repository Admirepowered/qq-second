name: Build & Release

# 手动触发：构建四端产物 → 可选上传 GitHub Release → 发布成功后自动将小版本号 +1 并提交。
# 四端：Windows amd64（UPX）/ macOS arm64 / Ubuntu 22.04 amd64（webkit2gtk-4.0）/ Ubuntu 24.04 amd64（webkit2gtk-4.1）。
# 版本号从 internal/version/version.go 读取，不支持手动输入；中间版本号变化请直接改 version.go。
on:
  workflow_dispatch:
    inputs:
      release:
        description: 构建并上传到 GitHub Release
        type: boolean
        default: false
      prerelease:
        description: 标记为预发布（Pre-release）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          v=$(grep -oP 'const Version = "\K[^"]+' internal/version/version.go)
          v="${v#v}"
          if [ -z "$v" ]; then echo "无法从 internal/version/version.go 读取版本号"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "resolved version: v$v"

  client-windows:
    name: Client / Windows amd64
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          (Join-Path (go env GOPATH) 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path (go env GOPATH) 'bin\wails.exe') | ForEach-Object { & $_ version }
      - name: Prepare icon assets
        shell: pwsh
        run: go run ./cmd/icon
      - name: Build client
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          wails build -clean -platform windows/amd64 -ldflags "-s -w"
          if ($LASTEXITCODE -ne 0) { throw 'wails build failed' }
      - name: UPX compress
        shell: pwsh
        run: |
          choco install upx -y --no-progress | Out-Null
          $upx = (Get-Command upx -ErrorAction SilentlyContinue).Source
          if (-not $upx) { throw 'upx not found' }
          & $upx --best --force build\bin\QQSecond.exe | Out-Null
          Get-Item build\bin\QQSecond.exe | Select-Object Length
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\bin\QQSecond.exe "dist\QQSecond-windows-amd64-${{ needs.meta.outputs.version }}.exe"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows-amd64
          path: dist/*.exe
          if-no-files-found: error

  client-macos:
    name: Client / macOS arm64
    needs: meta
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails" version
      - name: Prepare icon assets
        shell: bash
        run: go run ./cmd/icon
      - name: Build client
        shell: bash
        run: |
          set -euo pipefail
          wails build -clean -platform darwin/arm64 -ldflags "-s -w"
          APP=$(find build/bin -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "no .app bundle produced"; ls -R build/bin; exit 1
          fi
          echo "bundle: $APP"
          # Ad-hoc 签名，避免 Gatekeeper 报损坏
          codesign --force --deep --sign - "$APP" || true
          mkdir -p dist
          rm -rf dist/QQSecond.app
          cp -R "$APP" dist/QQSecond.app
          ditto -c -k --sequesterRsrc --keepParent dist/QQSecond.app \
            "dist/QQSecond-macos-arm64-${{ needs.meta.outputs.version }}.zip"
          rm -rf dist/QQSecond.app
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  client-ubuntu22:
    name: Client / Ubuntu 22.04 amd64 (webkit2gtk-4.0)
    needs: meta
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Wails dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails" version
      - name: Prepare icon assets
        shell: bash
        run: go run ./cmd/icon
      - name: Build client
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu 22.04 用 webkit2gtk-4.0（默认构建标签）
          wails build -clean -platform linux/amd64 -ldflags "-s -w"
          mkdir -p dist
          tar -czf "dist/QQSecond-linux-amd64-ubuntu22-${{ needs.meta.outputs.version }}.tar.gz" -C build/bin QQSecond
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-ubuntu22-amd64
          path: dist/*.tar.gz
          if-no-files-found: error

  client-ubuntu24:
    name: Client / Ubuntu 24.04 amd64 (webkit2gtk-4.1)
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Wails dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails" version
      - name: Prepare icon assets
        shell: bash
        run: go run ./cmd/icon
      - name: Build client
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu 24.04 用 webkit2gtk-4.1
          wails build -clean -platform linux/amd64 -tags webkit2_41 -ldflags "-s -w"
          mkdir -p dist
          tar -czf "dist/QQSecond-linux-amd64-ubuntu24-${{ needs.meta.outputs.version }}.tar.gz" -C build/bin QQSecond
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-ubuntu24-amd64
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Upload to GitHub Release
    needs: [meta, client-windows, client-macos, client-ubuntu22, client-ubuntu24]
    if: ${{ always() && inputs.release && needs.meta.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List release files
        shell: bash
        run: ls -lh dist
      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: QQ Second ${{ needs.meta.outputs.tag }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  bump-patch:
    name: Auto bump patch version
    needs: [meta, release]
    # Release 发布成功后把小版本号 +1（0.1.1 → 0.1.2），供下次构建使用。
    if: ${{ always() && inputs.release && needs.meta.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump patch version
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.meta.outputs.version }}"
          IFS='.' read -r major minor patch <<< "$v"
          next="$major.$minor.$((patch + 1))"
          sed -i "s/^const Version = \"[^\"]*\"/const Version = \"$next\"/" internal/version/version.go
          grep 'const Version' internal/version/version.go
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internal/version/version.go
          git commit -m "chore: bump version to $next [skip ci]"
          git push
